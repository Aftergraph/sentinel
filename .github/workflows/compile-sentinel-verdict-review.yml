name: Compile Sentinel verdict review

on:
  push:
    branches:
      - frontier/agentic-workflows-track
    paths:
      - .github/workflows/sentinel-verdict-review.md
      - .github/workflows/compile-sentinel-verdict-review.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compile-sentinel-verdict-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install pinned gh-aw compiler
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/linux-amd64 https://github.com/github/gh-aw/releases/download/v0.89.21/linux-amd64
          curl -fsSL -o /tmp/checksums.txt https://github.com/github/gh-aw/releases/download/v0.89.21/checksums.txt
          (cd /tmp && grep ' linux-amd64$' checksums.txt | sha256sum --check --strict)
          mv /tmp/linux-amd64 /tmp/gh-aw
          chmod +x /tmp/gh-aw
          /tmp/gh-aw --version

      - name: Compile Sentinel verdict review
        shell: bash
        run: |
          set -euo pipefail
          /tmp/gh-aw compile sentinel-verdict-review --strict
      - name: Emit generated lock payload
        shell: bash
        run: |
          set -euo pipefail
          echo 'GH_AW_LOCK_B64_BEGIN'
          base64 -w0 .github/workflows/sentinel-verdict-review.lock.yml
          echo
          echo 'GH_AW_LOCK_B64_END'


      - name: Commit generated lock file
        shell: bash
        run: |
          set -euo pipefail
          git add .github/workflows/sentinel-verdict-review.lock.yml
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "aftergraph-ci"
          git config user.email "ci@aftergraph.org"
          git commit -m "fix(ci): compile Sentinel org-billing review workflow"
          git push
