name: Economic Signer Provider

on:
  pull_request:
    paths:
      - "lib/economic-signer-provider.js"
      - "test/economic-signer-provider.test.mjs"
      - ".github/workflows/economic-signer-provider.yml"
  push:
    branches: [main]
    paths:
      - "lib/economic-signer-provider.js"
      - "test/economic-signer-provider.test.mjs"
      - ".github/workflows/economic-signer-provider.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify opaque signer provider lifecycle
        run: node --test test/economic-signer-provider.test.mjs
