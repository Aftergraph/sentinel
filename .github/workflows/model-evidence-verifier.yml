name: Independent Model Evidence Verifier

on:
  push:
    paths:
      - 'lib/model-evidence-verifier.js'
      - 'lib/domain-verification.js'
      - 'lib/domain-works-publisher.js'
      - 'test/domain-verification.test.mjs'
      - 'test/domain-works-publisher.test.mjs'
      - 'test/cli-domain-runtime.test.mjs'
      - 'test/model-evidence-verifier.test.mjs'
      - 'package.json'
      - '.github/workflows/model-evidence-verifier.yml'
      - 'evidence/model-verification/**'
  pull_request:
    paths:
      - 'lib/model-evidence-verifier.js'
      - 'lib/domain-verification.js'
      - 'lib/domain-works-publisher.js'
      - 'test/domain-verification.test.mjs'
      - 'test/domain-works-publisher.test.mjs'
      - 'test/cli-domain-runtime.test.mjs'
      - 'test/model-evidence-verifier.test.mjs'
      - 'package.json'
      - '.github/workflows/model-evidence-verifier.yml'
      - 'evidence/model-verification/**'

permissions:
  contents: read

concurrency:
  group: sentinel-model-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Node runtime
        run: node --version
      - name: Run Sentinel test suite
        run: npm test
