name: Economic Evidence Pack

on:
  pull_request:
    paths:
      - "lib/economic-evidence-pack.js"
      - "test/economic-evidence-pack.test.mjs"
      - ".github/workflows/economic-evidence-pack.yml"
  push:
    branches: [main]
    paths:
      - "lib/economic-evidence-pack.js"
      - "test/economic-evidence-pack.test.mjs"
      - ".github/workflows/economic-evidence-pack.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify immutable Economic EvidencePack
        run: node --test test/economic-evidence-pack.test.mjs
