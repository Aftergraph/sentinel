name: Economic Canonical Readiness

on:
  pull_request:
    paths:
      - "lib/economic-canonical-readiness.js"
      - "test/economic-canonical-readiness.test.mjs"
      - ".github/workflows/economic-canonical-readiness.yml"
  push:
    branches: [main]
    paths:
      - "lib/economic-canonical-readiness.js"
      - "test/economic-canonical-readiness.test.mjs"
      - ".github/workflows/economic-canonical-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Verify Economic canonical-readiness evidence boundaries
        run: node --test test/economic-canonical-readiness.test.mjs
