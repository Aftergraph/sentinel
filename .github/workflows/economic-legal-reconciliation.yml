name: Economic Legal Reconciliation

on:
  pull_request:
    paths:
      - "lib/economic-legal-reconciliation.js"
      - "test/economic-legal-reconciliation.test.mjs"
      - ".github/workflows/economic-legal-reconciliation.yml"
  push:
    branches: [main]
    paths:
      - "lib/economic-legal-reconciliation.js"
      - "test/economic-legal-reconciliation.test.mjs"
      - ".github/workflows/economic-legal-reconciliation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Verify legal custody registry representation alignment
        run: node --test test/economic-legal-reconciliation.test.mjs
