name: Sentinel GitHub App webhook secret

on:
  workflow_dispatch:
    inputs:
      mode:
        description: check (read-only) or rotate
        required: true
        type: choice
        options: [check, rotate]
      confirmation:
        description: For rotate, enter ROTATE_SENTINEL_WEBHOOK_SECRET
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sentinel-github-app-vds-deploy
  cancel-in-progress: false

jobs:
  webhook-secret:
    runs-on: [self-hosted, Linux, X64, vds]
    timeout-minutes: 10
    steps:
      - name: Check or rotate on the host
        shell: bash
        run: |
          set -euo pipefail
          deploy() {
            if [ "$(id -u)" -eq 0 ]; then /usr/local/sbin/sentinel-deploy "$@"; else sudo -n /usr/local/sbin/sentinel-deploy "$@"; fi
          }
          if [ "${{ inputs.mode }}" = "check" ]; then
            deploy webhook-check
            exit 0
          fi
          test "${{ inputs.confirmation }}" = "ROTATE_SENTINEL_WEBHOOK_SECRET"
          deploy webhook-rotate
          deploy restart

          port="$(deploy port)"; port="${port:-8787}"
          [[ "$port" =~ ^[0-9]+$ ]]
          base="http://sentinel-loopback.invalid:${port}"
          r=(--noproxy '*' --resolve "sentinel-loopback.invalid:${port}:127.0.0.1" --max-time 2)
          code=000
          for attempt in $(seq 1 30); do
            code="$(curl -sS "${r[@]}" -o "${{ runner.temp }}/h.json" -w '%{http_code}' "$base/healthz" || true)"
            [ "$code" = "200" ] && break
            sleep 0.5
          done
          test "$code" = "200"
          cat "${{ runner.temp }}/h.json"; echo
          grep -q '"webhookEnabled":true' "${{ runner.temp }}/h.json"

          # An unsigned delivery must now be refused with 401 (was 503 in poll-only).
          unsigned="$(curl -sS "${r[@]}" -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' "$base/webhooks/github" || true)"
          echo "unsigned_post_http=$unsigned"
          test "$unsigned" = "401"
