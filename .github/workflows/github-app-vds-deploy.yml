name: Sentinel GitHub App VDS deploy

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact Sentinel commit SHA to deploy
        required: true
        type: string
      confirmation:
        description: Enter DEPLOY_SENTINEL_GITHUB_APP
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sentinel-github-app-vds-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, vds]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify explicit release and confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "DEPLOY_SENTINEL_GITHUB_APP"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${{ inputs.release_sha }}"
          test "${RUNNER_NAME:-}" = "vps-ci-01"
          test "$(id -un)" = "nora"
          run_root() {
            if [ "$(id -u)" -eq 0 ]; then "$@"; else sudo -n "$@"; fi
          }
          run_root true

      - name: Verify Sentinel before deployment
        shell: bash
        run: |
          set -euo pipefail
          npm test

      - name: Install exact revision
        shell: bash
        run: |
          set -euo pipefail
          run_root() {
            if [ "$(id -u)" -eq 0 ]; then "$@"; else sudo -n "$@"; fi
          }
          run_root ops/deploy/install.sh
          printf '%s\n' "${{ inputs.release_sha }}" > "${{ runner.temp }}/sentinel-source-revision"
          run_root install -o root -g root -m 0444 "${{ runner.temp }}/sentinel-source-revision" /opt/sentinel/.source-revision

      - name: Restart and verify runtime
        shell: bash
        run: |
          set -euo pipefail
          run_root() {
            if [ "$(id -u)" -eq 0 ]; then "$@"; else sudo -n "$@"; fi
          }
          run_root systemctl restart sentinel-github-app.service
          run_root systemctl is-active --quiet sentinel-github-app.service
          test "$(run_root cat /opt/sentinel/.source-revision)" = "${{ inputs.release_sha }}"

          port="$(run_root awk -F= '$1=="PORT" {print $2}' /etc/sentinel/github-app.env | tail -n 1 | tr -d '[:space:]')"
          port="${port:-8787}"
          [[ "$port" =~ ^[0-9]+$ ]]
          health_code="$(curl -sS --resolve "sentinel-loopback.invalid:${port}:127.0.0.1" -o "${{ runner.temp }}/sentinel-health.json" -w '%{http_code}' --max-time 5 "http://sentinel-loopback.invalid:${port}/healthz")"
          test "$health_code" = "200"
          cat "${{ runner.temp }}/sentinel-health.json"

          checkout_hash="$(sha256sum lib/rulepack.js | awk '{print $1}')"
          deployed_hash="$(sha256sum /opt/sentinel/lib/rulepack.js | awk '{print $1}')"
          test "$checkout_hash" = "$deployed_hash"

          checkout_verifier_hash="$(sha256sum lib/fihim-operator-deployment-verifier.mjs | awk '{print $1}')"
          deployed_verifier_hash="$(sha256sum /opt/sentinel/lib/fihim-operator-deployment-verifier.mjs | awk '{print $1}')"
          test "$checkout_verifier_hash" = "$deployed_verifier_hash"

          printf '{"release_sha":"%s","service_active":true,"health_http":"200","rulepack_sha256":"sha256:%s","fihim_verifier_sha256":"sha256:%s"}\n'             "${{ inputs.release_sha }}" "$deployed_hash" "$deployed_verifier_hash"             > "${{ runner.temp }}/sentinel-vds-deploy-receipt.json"

      - name: Upload deployment receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sentinel-github-app-vds-deploy-${{ github.run_id }}
          path: ${{ runner.temp }}/sentinel-vds-deploy-receipt.json
          if-no-files-found: error
          retention-days: 30
