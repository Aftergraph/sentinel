name: Sentinel GitHub App VDS deploy

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact Sentinel commit SHA to deploy
        required: true
        type: string
      confirmation:
        description: Enter DEPLOY_SENTINEL_GITHUB_APP
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sentinel-github-app-vds-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, vds]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify explicit release and confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "DEPLOY_SENTINEL_GITHUB_APP"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${{ inputs.release_sha }}"
          test "${RUNNER_NAME:-}" = "vps-ci-01"
          test "$(id -un)" = "nora"
          deploy() {
            if [ "$(id -u)" -eq 0 ]; then /usr/local/sbin/sentinel-deploy "$@"; else sudo -n /usr/local/sbin/sentinel-deploy "$@"; fi
          }
          deploy preflight

      - name: Preflight host runtime config
        # Fail closed BEFORE install/restart: a host without credentials or an
        # explicit PORT would otherwise be restarted into a crash loop
        # (observed on runs 36944642353..36977384674). Values are never printed.
        shell: bash
        run: |
          set -euo pipefail
          run_root() {
            if [ "$(id -u)" -eq 0 ]; then "$@"; else sudo -n "$@"; fi
          }
          host="$(hostname -s)"
          env_file=/etc/sentinel/github-app.env
          if ! run_root test -r "$env_file"; then
            echo "::error::${env_file} missing on ${host}; refusing to install or restart"
            exit 1
          fi
          get() {
            run_root awk -v k="$1" 'index($0, k "=") == 1 { v = substr($0, length(k) + 2) } END { print v }' "$env_file" | tr -d '[:space:]'
          }
          port="$(get PORT)"
          if ! [[ "$port" =~ ^[0-9]+$ ]]; then
            echo "::error::PORT is not set in ${env_file} on ${host}; refusing to install or restart"
            exit 1
          fi
          app_id="$(get GITHUB_APP_ID)"
          key_file="$(get GITHUB_APP_KEY_FILE)"
          if [ -n "$app_id" ] && [ -n "$key_file" ]; then
            if ! run_root test -s "$key_file"; then
              echo "::error::GITHUB_APP_KEY_FILE (${key_file}) is missing or empty on ${host}; refusing to install or restart"
              exit 1
            fi
            auth=app
          elif [ -n "$(get GITHUB_TOKEN)" ]; then
            auth=token
          else
            echo "::error::no GitHub auth configured in ${env_file} on ${host}; refusing to install or restart"
            exit 1
          fi
          echo "preflight ok: host=${host} port=${port} auth=${auth}"

      - name: Verify Sentinel before deployment
        shell: bash
        run: |
          set -euo pipefail
          npm test

      - name: Install exact revision
        shell: bash
        run: |
          set -euo pipefail
          deploy() {
            if [ "$(id -u)" -eq 0 ]; then /usr/local/sbin/sentinel-deploy "$@"; else sudo -n /usr/local/sbin/sentinel-deploy "$@"; fi
          }
          deploy install "$GITHUB_WORKSPACE" "${{ inputs.release_sha }}"

      - name: Restart and verify runtime
        shell: bash
        run: |
          set -euo pipefail
          deploy() {
            if [ "$(id -u)" -eq 0 ]; then /usr/local/sbin/sentinel-deploy "$@"; else sudo -n /usr/local/sbin/sentinel-deploy "$@"; fi
          }
          deploy restart
          test "$(deploy revision)" = "${{ inputs.release_sha }}"

          port="$(deploy port)"
          port="${port:-8787}"
          [[ "$port" =~ ^[0-9]+$ ]]
          health_code="000"
          for attempt in $(seq 1 20); do
            health_code="$(curl -sS --noproxy '*' --resolve "sentinel-loopback.invalid:${port}:127.0.0.1" -o "${{ runner.temp }}/sentinel-health.json" -w '%{http_code}' --max-time 2 "http://sentinel-loopback.invalid:${port}/healthz" || true)"
            if [ "$health_code" = "200" ]; then break; fi
            sleep 0.5
          done
          test "$health_code" = "200"
          cat "${{ runner.temp }}/sentinel-health.json"

          checkout_hash="$(sha256sum lib/rulepack.js | awk '{print $1}')"
          deployed_hash="$(sha256sum /opt/sentinel/lib/rulepack.js | awk '{print $1}')"
          test "$checkout_hash" = "$deployed_hash"

          checkout_verifier_hash="$(sha256sum lib/fihim-operator-deployment-verifier.mjs | awk '{print $1}')"
          deployed_verifier_hash="$(sha256sum /opt/sentinel/lib/fihim-operator-deployment-verifier.mjs | awk '{print $1}')"
          test "$checkout_verifier_hash" = "$deployed_verifier_hash"

          printf '{"release_sha":"%s","service_active":true,"health_http":"200","rulepack_sha256":"sha256:%s","fihim_verifier_sha256":"sha256:%s"}\n'             "${{ inputs.release_sha }}" "$deployed_hash" "$deployed_verifier_hash"             > "${{ runner.temp }}/sentinel-vds-deploy-receipt.json"

      - name: Service diagnostics on failure
        if: failure()
        shell: bash
        run: |
          deploy() {
            if [ "$(id -u)" -eq 0 ]; then /usr/local/sbin/sentinel-deploy "$@"; else sudo -n /usr/local/sbin/sentinel-deploy "$@"; fi
          }
          deploy diagnose || true

      - name: Upload deployment receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sentinel-github-app-vds-deploy-${{ github.run_id }}
          path: ${{ runner.temp }}/sentinel-vds-deploy-receipt.json
          if-no-files-found: error
          retention-days: 30
