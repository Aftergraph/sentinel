name: Sentinel GitHub App VDS deploy

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact Sentinel commit SHA to deploy
        required: true
        type: string
      confirmation:
        description: Enter DEPLOY_SENTINEL_GITHUB_APP
        required: true
        type: string
      webhook_secret:
        description: "After deploy: keep the webhook secret, check the App webhook config, or rotate the secret on the host"
        required: false
        default: keep
        type: choice
        options: [keep, check, rotate]

permissions:
  contents: read

concurrency:
  group: sentinel-github-app-vds-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, vds]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify explicit release and confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "DEPLOY_SENTINEL_GITHUB_APP"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${{ inputs.release_sha }}"
          test "${RUNNER_NAME:-}" = "vps-ci-01"
          test "$(id -un)" = "nora"
          deploy() {
            if [ "$(id -u)" -eq 0 ]; then /usr/local/sbin/sentinel-deploy "$@"; else sudo -n /usr/local/sbin/sentinel-deploy "$@"; fi
          }
          deploy preflight

      - name: Verify Sentinel before deployment
        shell: bash
        run: |
          set -euo pipefail
          npm test

      - name: Install exact revision
        shell: bash
        run: |
          set -euo pipefail
          deploy() {
            if [ "$(id -u)" -eq 0 ]; then /usr/local/sbin/sentinel-deploy "$@"; else sudo -n /usr/local/sbin/sentinel-deploy "$@"; fi
          }
          deploy install "$GITHUB_WORKSPACE" "${{ inputs.release_sha }}"

      - name: Restart and verify runtime
        shell: bash
        run: |
          set -euo pipefail
          deploy() {
            if [ "$(id -u)" -eq 0 ]; then /usr/local/sbin/sentinel-deploy "$@"; else sudo -n /usr/local/sbin/sentinel-deploy "$@"; fi
          }
          deploy restart
          test "$(deploy revision)" = "${{ inputs.release_sha }}"

          port="$(deploy port)"
          port="${port:-8787}"
          [[ "$port" =~ ^[0-9]+$ ]]
          health_code="000"
          for attempt in $(seq 1 20); do
            health_code="$(curl -sS --noproxy '*' --resolve "sentinel-loopback.invalid:${port}:127.0.0.1" -o "${{ runner.temp }}/sentinel-health.json" -w '%{http_code}' --max-time 2 "http://sentinel-loopback.invalid:${port}/healthz" || true)"
            if [ "$health_code" = "200" ]; then break; fi
            sleep 0.5
          done
          test "$health_code" = "200"
          cat "${{ runner.temp }}/sentinel-health.json"

          checkout_hash="$(sha256sum lib/rulepack.js | awk '{print $1}')"
          deploy hashes > "${{ runner.temp }}/sentinel-deployed-hashes.txt"
          deployed_hash="$(awk '$2=="/opt/sentinel/lib/rulepack.js" {print $1}' "${{ runner.temp }}/sentinel-deployed-hashes.txt")"
          test -n "$deployed_hash"
          test "$checkout_hash" = "$deployed_hash"

          checkout_verifier_hash="$(sha256sum lib/fihim-operator-deployment-verifier.mjs | awk '{print $1}')"
          deployed_verifier_hash="$(awk '$2=="/opt/sentinel/lib/fihim-operator-deployment-verifier.mjs" {print $1}' "${{ runner.temp }}/sentinel-deployed-hashes.txt")"
          test -n "$deployed_verifier_hash"
          test "$checkout_verifier_hash" = "$deployed_verifier_hash"

          printf '{"release_sha":"%s","service_active":true,"health_http":"200","rulepack_sha256":"sha256:%s","fihim_verifier_sha256":"sha256:%s"}\n'             "${{ inputs.release_sha }}" "$deployed_hash" "$deployed_verifier_hash"             > "${{ runner.temp }}/sentinel-vds-deploy-receipt.json"

      - name: Webhook secret (check or rotate on the host)
        if: inputs.webhook_secret == 'check' || inputs.webhook_secret == 'rotate'
        shell: bash
        run: |
          set -euo pipefail
          deploy() {
            if [ "$(id -u)" -eq 0 ]; then /usr/local/sbin/sentinel-deploy "$@"; else sudo -n /usr/local/sbin/sentinel-deploy "$@"; fi
          }
          if [ "${{ inputs.webhook_secret }}" = "check" ]; then
            deploy webhook-check
            exit 0
          fi
          # Secret is generated, registered on the App and stored on this host; never printed.
          deploy webhook-rotate
          deploy restart

          port="$(deploy port)"; port="${port:-8787}"
          [[ "$port" =~ ^[0-9]+$ ]]
          base="http://sentinel-loopback.invalid:${port}"
          r=(--noproxy '*' --resolve "sentinel-loopback.invalid:${port}:127.0.0.1" --max-time 2)
          code=000
          for attempt in $(seq 1 30); do
            code="$(curl -sS "${r[@]}" -o "${{ runner.temp }}/sentinel-health-webhook.json" -w '%{http_code}' "$base/healthz" || true)"
            [ "$code" = "200" ] && break
            sleep 0.5
          done
          test "$code" = "200"
          cat "${{ runner.temp }}/sentinel-health-webhook.json"; echo
          grep -q '"webhookEnabled":true' "${{ runner.temp }}/sentinel-health-webhook.json"
          # An unsigned delivery must now be refused with 401 (503 in poll-only mode).
          unsigned="$(curl -sS "${r[@]}" -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' "$base/webhooks/github" || true)"
          echo "unsigned_post_http=$unsigned"
          test "$unsigned" = "401"

      - name: Service diagnostics on failure
        if: failure()
        shell: bash
        run: |
          deploy() {
            if [ "$(id -u)" -eq 0 ]; then /usr/local/sbin/sentinel-deploy "$@"; else sudo -n /usr/local/sbin/sentinel-deploy "$@"; fi
          }
          deploy diagnose || true

      - name: Upload deployment receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sentinel-github-app-vds-deploy-${{ github.run_id }}
          path: ${{ runner.temp }}/sentinel-vds-deploy-receipt.json
          if-no-files-found: error
          retention-days: 30
