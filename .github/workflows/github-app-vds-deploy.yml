name: Sentinel GitHub App VDS deploy

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact Sentinel commit SHA to deploy
        required: true
        type: string
      confirmation:
        description: Enter DEPLOY_SENTINEL_GITHUB_APP
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sentinel-github-app-vds-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, aftergraph-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify explicit release and confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "DEPLOY_SENTINEL_GITHUB_APP"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${{ inputs.release_sha }}"
          test "$(hostname -s)" = "vmi3517816"
          test "$(id -un)" = "agci"
          test "$(id -u)" -ne 0
          sudo -n true

      - name: Verify Sentinel before deployment
        shell: bash
        run: |
          set -euo pipefail
          npm test

      - name: Install exact revision
        shell: bash
        run: |
          set -euo pipefail
          sudo -n ops/deploy/install.sh
          printf '%s\n' "${{ inputs.release_sha }}" > "${{ runner.temp }}/sentinel-source-revision"
          sudo -n install -o root -g sentinel -m 0440 "${{ runner.temp }}/sentinel-source-revision" /opt/sentinel/.source-revision

      - name: Restart and verify runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo -n systemctl restart sentinel-github-app.service
          sudo -n systemctl is-active --quiet sentinel-github-app.service
          test "$(cat /opt/sentinel/.source-revision)" = "${{ inputs.release_sha }}"

          health_code="$(curl -sS -o "${{ runner.temp }}/sentinel-health.json" -w '%{http_code}' --max-time 5 http://127.0.0.1:8788/healthz)"
          test "$health_code" = "200"
          cat "${{ runner.temp }}/sentinel-health.json"

          checkout_hash="$(sha256sum lib/rulepack.js | awk '{print $1}')"
          deployed_hash="$(sha256sum /opt/sentinel/lib/rulepack.js | awk '{print $1}')"
          test "$checkout_hash" = "$deployed_hash"

          checkout_verifier_hash="$(sha256sum lib/fihim-operator-deployment-verifier.mjs | awk '{print $1}')"
          deployed_verifier_hash="$(sha256sum /opt/sentinel/lib/fihim-operator-deployment-verifier.mjs | awk '{print $1}')"
          test "$checkout_verifier_hash" = "$deployed_verifier_hash"

          printf '{"release_sha":"%s","service_active":true,"health_http":"200","rulepack_sha256":"sha256:%s","fihim_verifier_sha256":"sha256:%s"}\n'             "${{ inputs.release_sha }}" "$deployed_hash" "$deployed_verifier_hash"             > "${{ runner.temp }}/sentinel-vds-deploy-receipt.json"

      - name: Upload deployment receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sentinel-github-app-vds-deploy-${{ github.run_id }}
          path: ${{ runner.temp }}/sentinel-vds-deploy-receipt.json
          if-no-files-found: error
          retention-days: 30
